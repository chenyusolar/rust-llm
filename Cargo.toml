[package]
name = "rust-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = { version = "0.9", optional = true }
safemem = "0.3"
clap = { version = "4.4", features = ["derive"] }
wgpu = { version = "0.19", optional = true }
bytemuck = { version = "1.14", optional = true }
axum = { version = "0.7", optional = true }
futures = "0.3"
async-stream = "0.3"
byteorder = "1.4"
tokio-stream = { version = "0.1", features = ["sync"] }

[features]
default = ["server"]
gpu = ["wgpu", "bytemuck"]
mmap = ["memmap2"]
server = ["axum"]

[lib]
name = "rust_llm"
path = "src/lib.rs"

[[bin]]
name = "rust-llm"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
